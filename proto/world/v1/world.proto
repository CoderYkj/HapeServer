syntax = "proto3";

package hape.world.v1;

option go_package = "hapeserver/internal/protocol/worldv1;worldv1";

message Command {
  uint64 seq = 1;
  uint64 player_id = 2;
  string action = 3;
  uint64 target_id = 4;
  int64 gold = 5;
  int64 target_gold = 6;
  int64 power = 7;
  string trade_id = 8;
  int32 k = 9;
  uint32 season = 10;
  int64 def_power = 11;
  string battle_id = 12;
}

message Assets {
  int64 gold = 1;
  int64 wood = 2;
  int64 food = 3;
  repeated int32 items = 4;
}

message City {
  int32 level = 1;
  int32 x = 2;
  int32 y = 3;
}

message March {
  uint64 id = 1;
  uint64 from = 2;
  uint64 to = 3;
  int64 arrive_at = 4;
}

message Queue {
  uint64 id = 1;
  string kind = 2;
  int64 done_at = 3;
  bool canceled = 4;
}

message PlayerState {
  uint64 player_id = 1;
  uint32 season_id = 2;
  Assets resources = 3;
  City city = 4;
  int64 power = 5;
  repeated March marches = 6;
  repeated Queue queues = 7;
  map<string, Assets> escrow = 8;
  map<string, bool> settled_trades = 9;
  repeated string seen_ops = 10;
  uint64 version = 11;
}

message RankEntry {
  uint64 pid = 1;
  int64 power = 2;
}

message RankResult {
  int32 rank = 1;
  bool found = 2;
}

message TopResult {
  repeated RankEntry entries = 1;
}

message Trade {
  string id = 1;
  uint32 world = 2;
  uint32 season = 3;
  uint64 a = 4;
  uint64 b = 5;
  Assets a_assets = 6;
  Assets b_assets = 7;
  string state = 8;
  uint64 version = 9;
  int64 expire_at = 10;
}

message Battle {
  string id = 1;
  uint32 world = 2;
  uint32 season = 3;
  uint64 attacker = 4;
  uint64 defender = 5;
  int64 attacker_power = 6;
  int64 defender_power = 7;
  uint64 winner = 8;
  string state = 9;
  int64 created_at = 10;
  int64 settled_at = 11;
}

message BattlePage {
  repeated Battle items = 1;
  int64 next_created_at = 2;
  string next_id = 3;
}

message ActionStats {
  uint32 season = 1;
  int32 touched = 2;
  int32 reset = 3;
  int32 rewarded = 4;
  int32 skipped = 5;
}

message Response {
  bool ok = 1;
  string error = 2;
  oneof result {
    PlayerState state = 3;
    RankResult rank = 4;
    TopResult top = 5;
    Trade trade = 6;
    Battle battle = 7;
    BattlePage battle_page = 8;
    ActionStats stats = 9;
  }
}