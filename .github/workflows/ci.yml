name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Tidy
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Mongo integration
        run: go test ./internal/battle ./internal/trade -run 'TestMongo' -v -count=1

  replica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Start single-node replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/27018' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Transaction integration
        env:
          MONGO_REPLSET_URL: mongodb://127.0.0.1:27018/?replicaSet=rs0
          MONGO_REPLSET_ADMIN_URL: mongodb://127.0.0.1:27018/?directConnection=true
          MONGO_REPLSET_HOST: 127.0.0.1:27018
        run: go test ./internal/trade -run TestMongoReplicaSetTransaction -v -count=1
